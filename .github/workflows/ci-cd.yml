name: CI & CD (Bon cop, bad cop)

# Trigger : l'événement qui déclenche le pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Un JOB se déroule sur une machine spécifique
  # Les étapes partagent le même disque
  ci: # Nom du job
    runs-on: ubuntu-26.04 # Machine "ubuntu" fournie par Github
    env: # Paramétrage de variables d'environnement utilisables dans le workflow
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }} # On récupère les secrets Github
    steps:
      - uses: actions/checkout@v4 # Récupération du code
      - uses: actions/setup-node@v4 # Configuration de NodeJS
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: Debug
        name: Debug variables d'environnement
        run: |
          if [ -n "$MAIL_PASSWORD" ]; then
            echo "MAIL_PASSWORD : OK (non vide)"
          else
            echo "MAIL_PASSWORD : VIDE"
          fi

      # Die Hard : vérification statique
      - id: lint
        name: Die Hard - Vérification statique - Lint
        run: npm run lint

      # Terminator : tests unitaires
      - id: test
        name: Tests unitaires
        if: ${{ !cancelled() }}
        run: npm test

      # Commando : build (seulement si lint et tests sont verts)
      - id: build
        name: Build
        run: npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}

      # Le site construit est transmis au workflow CD
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3

      # Générique de fin : résumé affiché sur la page du run
      - name: Rapport CI
        if: always()
        env: # Déclaration de plusieurs variables réutilisables
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          icon() { case "$1" in success) echo "OK";; skipped) echo "Continue";; *) echo "Failed";; esac; }
          {
            echo "## Rapport : CI"
            echo ""
            echo "| Étape | Résultat |"
            echo "|---|---|"
            echo "| Vérification statique | $(icon "$LINT") |"
            echo "| Tests unitaires | $(icon "$TEST") |"
            echo "| Build | $(icon "$BUILD") |"
            echo ""
            echo "_Réalisé par ${{ github.actor }} · commit \`${GITHUB_SHA::7}\`_"
          } >> "$GITHUB_STEP_SUMMARY"

      # Email de fin de build (ignoré si les secrets ne sont pas configurés)
      - name: Envoyer l'email contenant le rapport
        if: ${{ env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.mailgun.org
          server_port: 587
          # secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "Last GitHub Action Hero <${{ secrets.MAIL_USERNAME }}>"
          subject: "CI ${{ job.status }} : ${{ github.repository }}"
          body: |
            Le build de ${{ github.repository }} est terminé.

            Résultat : ${{ job.status }}
            Branche  : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}
            Auteur   : ${{ github.actor }}

            Détails : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # Déploiement sur GitHub Pages, uniquement si la CI est OKAY
  # L'application n'est pas rebuild : on récupère celle de la CI
  deploy:
    needs : ci # Dépendance avec CI
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Rapport CD
        if: always()
        env:
          DEPLOY: ${{ steps.deployment.outcome }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Rapport CD"
            echo ""
            if [ "$DEPLOY" = "success" ]; then
              echo "Mission accomplie - l'application est déployée : $URL"
            else
              echo "Mayday! Mayday! Impossible de déployer l'application."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer l'email
        if: ${{ env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "Last GitHub Action Hero <${{ secrets.MAIL_USERNAME }}>"
          subject: "CD ${{ job.status }} : ${{ github.repository }}"
          body: |
            Le déploiement de ${{ github.repository }} est terminé.

            Résultat : ${{ job.status }}
            Site     : ${{ steps.deployment.outputs.page_url }}

            Détails : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
