name: CI & CD (Bon cop, bad cop)

# Trigger : l'événement qui déclenche le pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      codename:
        description: "Nom de code"
        required: false
        default: "The True Last Github Action Hero"
        type: string

permissions:
  contents: read

jobs:
  # Un JOB se déroule sur une machine spécifique
  # Les étapes partagent le même disque
  ci: # Nom du job
    runs-on: ubuntu-26.04 # Machine "ubuntu" fournie par Github
    steps:
      - uses: actions/checkout@v7 # Récupération du code
      - uses: actions/setup-node@v7 # Configuration de NodeJS
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Étape uniquement présente pour vérifier le contenu des variables d'environnement
      - id: Debug
        name: Debug variables d'environnement
        run: |
          if [ -n "$MAIL_PASSWORD" ]; then
            echo "MAIL_PASSWORD : OK (non vide)"
          else
            echo "MAIL_PASSWORD : VIDE"
          fi

      # Die Hard : vérification statique
      - id: lint
        name: Die Hard - Vérification statique - Lint
        run: npm run lint

      # Terminator : tests unitaires
      - id: test
        name: Terminator - Tests unitaires
        if: ${{ !cancelled() }}
        run: npm test

      # Commando : build (seulement si lint et tests sont ok)
      - id: build
        name: Build
        run: npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}

      # Le site construit est ajouté à un aterfact github-pages
      # Plus d'informations sur les paramètres : https://github.com/actions/upload-pages-artifact#inputs-
      - id: artifact
        name: Création d'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # Au rapport : résumé affiché sur la page du run
      # Plus d'information ici : https://oneuptime.com/blog/post/2026-01-30-github-actions-step-summary/view
      - name: Résumé Github pour CI
        if: always()
        env: # Déclaration de plusieurs variables réutilisables
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          ARTIFACT_UPLOAD: ${{ steps.artifact.outcome }}
        run: |
          {
            echo "## Rapport : CI"
            echo ""
            echo "| Étape | Résultat |"
            echo "|---|---|"
            echo "| Vérification statique | $LINT |"
            echo "| Tests unitaires | $TEST |"
            echo "| Build | $BUILD |"
            echo "| Upload artifact | $ARTIFACT_UPLOAD |"
            echo ""
            echo "_Réalisé par ${{ github.actor }} · commit \`${GITHUB_SHA::7}\`_"
          } >> "$GITHUB_STEP_SUMMARY"
  # L'application n'est pas rebuild : on récupère celle de la CI
  cd:
    needs : ci # Dépendance avec CI
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write # permet d'écrire pour déployer une "Github page"
      id-token: write # permet de vérifier si le déploiement vient d'une source légitime
    environment:
      name: github-pages # récupération des variables d'environnement "github pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment # Déploiement automatique de l'artefact github-pages
        name: Rambo - déploiement derrière les lignes ennemies
        uses: actions/deploy-pages@v4

      - name: Résumé Github pour CD
        if: always()
        env:
          DEPLOY: ${{ steps.deployment.outcome }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Rapport CD"
            echo ""
            if [ "$DEPLOY" = "success" ]; then
              echo "Mission accomplie ! l'application est déployée : $URL"
            else
              echo "Mayday! Mayday! Impossible de déployer l'application."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport par email
        if: always() && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v6
        env: # Paramétrage d'une variable d'environnement utilisable dans l'email
          codename: ${{ inputs.codename || 'The True Last Github Action Hero' }}
        with:
          server_address: smtp.mailgun.org
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "Last GitHub Action Hero <${{ secrets.MAIL_USERNAME }}>"
          subject: "CD ${{ job.status }} : ${{ github.repository }}"
          body: |
            Rapport N°${{ github.run_id }}

            Nom de code de l'agent : ${{ env.codename }}

            Le déploiement de ${{ github.repository }} est terminé.

            Résultat : ${{ job.status }}
            Site     : ${{ steps.deployment.outputs.page_url }}
            Branche  : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}
            Auteur   : ${{ github.actor }}

            Détails : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
