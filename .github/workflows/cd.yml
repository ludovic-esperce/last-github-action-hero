name: CD - Déploie malgré l'adversité

# Se déclenche automatiquement quand le workflow "CI" se termine sur main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Rambo : déploiement sur GitHub Pages, uniquement si la CI est OKAY
  # L'application n'est pas rebuild : on récupère celle de la CI
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Générique de fin
        if: always()
        env:
          DEPLOY: ${{ steps.deployment.outcome }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Générique de fin : CD"
            echo ""
            if [ "$DEPLOY" = "success" ]; then
              echo "OK **Rambo** a déployé le site : $URL"
            else
              echo "FAILED **Rambo** n'a pas pu déployer le site."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer l'email
        if: always() && env.MAIL_PASSWORD != ''
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "Last GitHub Action Hero <${{ secrets.MAIL_USERNAME }}>"
          subject: "CD ${{ job.status }} : ${{ github.repository }}"
          body: |
            Le déploiement de ${{ github.repository }} est terminé.

            Résultat : ${{ job.status }}
            Site     : ${{ steps.deployment.outputs.page_url }}

            Détails : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
